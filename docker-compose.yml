services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: researchlens
      POSTGRES_PASSWORD: researchlens
      POSTGRES_DB: researchlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  ml:
    build: ./python-service
    ports:
      - "8000:8000"
    volumes:
      - ./python-service:/app

volumes:
  pgdata:
  qdrantdata: